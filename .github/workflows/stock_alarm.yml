name: Stock Alarm Bot

on:
  schedule:
    # 오전 7:50에 받기 위해, 10분 전인 오전 7:40 KST에 사전 실행 (UTC 전날 22:40)
    - cron: '40 22 * * *'
    # 오후 6:50에 받기 위해, 10분 전인 오후 6:40 KST에 사전 실행 (UTC 당일 09:40)
    - cron: '40 9 * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas finance-datareader requests lxml html5lib

      - name: Run stock screening bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
