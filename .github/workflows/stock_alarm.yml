name: Stock Alarm Bot

on:
  schedule:
    # 1. 한국 시간 오후 7시 (장 마감 최종 수급 확인)
    - cron: '0 10 * * *'
    # 2. 한국 시간 오전 8시 50분 (장 시작 직전 확인)
    - cron: '50 23 * * *'
  workflow_dispatch: # 지금 바로 수동으로 테스트할 수 있는 버튼

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'   # 파이썬 버전을 3.11로 상향 조정

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas FinanceDataReader requests

      - name: Run script
        run: |
          python main.py
