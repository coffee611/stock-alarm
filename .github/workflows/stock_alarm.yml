name: Stock Alarm Bot

on:
  schedule:
    # 1차: 한국 시간 평일 오전 8시 50분 (UTC 기준 23시 50분)
    # 2차: 한국 시간 평일 오후 6시 50분 (UTC 기준 09시 50분)
    - cron: '50 23,9 * * 1-5'
  workflow_dispatch: # Actions 탭에서 수동 실행 허용

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader pandas requests pykrx

      - name: Run stock screening script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
