name: Stock Alarm Bot

on:
  schedule:
    # 1. 오전 7:40 KST 실행 (UTC 전날 22:40 / 일~목요일 실행 -> 월~금 아침 수신)
    - cron: '40 22 * * 0-4'
    
    # 2. 오후 6:40 KST 실행 (UTC 당일 09:40 / 월~금요일 실행 -> 월~금 저녁 수신)
    - cron: '40 9 * * 1-5'

  workflow_dispatch: # 깃허브 웹에서 수동으로 테스트 실행할 수 있는 버튼 활성화
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas finance-datareader requests lxml html5lib

      - name: Run stock screening bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
