name: Stock Alarm Bot

on:
  schedule:
    # 매일 장 마감 후 (한국 시간 기준 평일 오후 4시 = UTC 07:00) 자동 실행
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # Actions 탭에서 [Run workflow] 버튼으로 수동 실행 허용

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader pandas requests

      - name: Run stock screening script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
